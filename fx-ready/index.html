<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
:root{--bg:#EDEFF3;--card:#fff;--ink:#14171C;--mute:#667080;--line:#E0E4EA;--accent:#2F4BD8;--accent-ink:#fff;--bad:#D2453D;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0E1116;--card:#171B22;--ink:#ECEFF4;--mute:#97A0AE;--line:#262C36;--accent:#8199FF;--accent-ink:#0E1116;--bad:#F06B61;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;display:grid;place-items:center;
 padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
form{width:100%;max-width:380px;background:var(--card);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:26px;letter-spacing:-.02em}p{margin:0;color:var(--mute)}
svg{width:30px;height:30px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
input[type=password]{height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-size:18px;padding:0 14px;width:100%}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{height:50px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;cursor:pointer}
button[disabled]{opacity:.5}
#err{color:var(--bad);font-size:14px;min-height:1.3em}
.u{position:absolute;opacity:0;pointer-events:none;height:0;width:0}
</style></head><body>
